<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archimedes | Neon Flower Cube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="scene">
        <div id="cube">
            <div class="side1"><p>🌻</p></div>
            <div class="side2"><p>🌺</p></div>
            <div class="side3"><p>🌻</p></div>
            <div class="side4"><p>🌻</p></div>
            <div class="side5"><p>🌷</p></div>
            <div class="side6"><p>🌺</p></div>
        </div>
    </main>
    <div class="music-control">
        <span class="music-indicator" id="musicIndicator"></span>
        <span id="musicLabel">Ambient soundtrack</span>
        <button id="musicButton" type="button">♫ Play music</button>
    </div>

    <div class="developer-signature">
        <span class="signature-line"></span>
        <p>MADE WITH LOVE <span class="signature-heart">♥</span></p>
        <h2>BY ARCHIMEDES</h2>
        <span class="signature-tagline">CREATIVITY • CODE • INNOVATION</span>
    </div>
    <script src="script.js"></script>
</body>
</html>
